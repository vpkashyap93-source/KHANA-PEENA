name: Deploy Khata Cloud to Pages

on:
  push:
    branches: [main, claude/cloud-accounting-software-wz7rkh]
    paths: ['cloud-accounting/**', '.github/workflows/deploy-cloud-accounting.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: cloud-accounting
      - run: npm run build
        working-directory: cloud-accounting
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cloud-accounting/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
